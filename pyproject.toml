[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cubrid-tc-registry"
version = "0.2.1"
description = "Per-testcase knowledge for CUBRID CI: failure signatures, issue links, notes, and known-issue rules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "rich>=14,<15",
]

[project.scripts]
cubrid-tcr = "tcr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tcr"]

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
